# Copied to /etc/wsl.conf on the control node by setup_control_node.sh.
[user]
default=yassine

[boot]
systemd=true

# "metadata" lets Linux permissions exist on Windows-drive files. Without it every
# folder under /mnt/c is world-writable (777) and Ansible refuses to load ansible.cfg
# from it (docs/DECISIONS.md D-03).
[automount]
options="metadata,umask=022,fmask=011"
