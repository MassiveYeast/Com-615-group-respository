# Project-level Ansible configuration for the NEL configuration-management PoC.
# Ansible only reads this file automatically when run from this directory
# (and only if the directory is not world-writable - see docs/DECISIONS.md D-03).

[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
# Collections live on the Linux filesystem, not in the repo (see docs/EXPERIMENTS.md EXP-03).
collections_path     = ~/.ansible/collections
# The vault password is kept OUTSIDE the repo (the repo is public).
vault_password_file  = ~/.ansible/nel_vault_pass
# Every run is appended here, which gives us an audit trail / evidence.
log_path             = evidence/logs/ansible.log
# Timing per task (profile_tasks) and per playbook (timer) for the comparison work.
callbacks_enabled    = ansible.posix.profile_tasks, ansible.posix.timer
callback_result_format = yaml
interpreter_python   = auto_silent
forks                = 10
gathering            = smart
retry_files_enabled  = False
# Host keys ARE checked; new hosts are trusted on first use (see ssh_args below).
host_key_checking    = True

[ssh_connection]
pipelining = True
# accept-new = trust a brand-new host once (fresh PXE builds), but refuse if a known key changes.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

[persistent_connection]
# Network devices (network_cli) can be slow to answer.
connect_timeout = 30
command_timeout = 60
