---
# How Ansible reaches a Linux server handed over by the PXE pipeline:
# key-based SSH as the "ansible" user, then sudo for admin tasks.
ansible_connection: ansible.builtin.ssh
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/nel_ansible_ed25519
ansible_become: true
ansible_become_method: ansible.builtin.sudo

# Approved host-firewall policy for every NEL Linux server (S1, AN-08).
# Default deny inbound; only these ports are open; anything else found in ufw is removed.
# SSH must stay in this list - the role refuses to run without it (lock-out guard).
linux_baseline_ufw_rules:
  - { rule: allow, port: "22", proto: tcp, comment: NEL management SSH }
  - { rule: allow, port: "80", proto: tcp, comment: NEL internal web service }
linux_baseline_ufw_prune: true
