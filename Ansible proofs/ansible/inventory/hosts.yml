---
# NEL inventory: one source of truth for both sites.
#
# Hosts are grouped two ways at once:
#   by FUNCTION (what config they get): linux_servers, ios_devices -> routers / switches
#   by LOCATION (where they are):       site_main, site_acquired
# A host can be in several groups, so a playbook can target e.g. "every Linux server"
# or "everything at the acquired site" without duplicating any host.
#
# Connection details per host live in host_vars/<hostname>.yml.
# Lab mapping: the PoC uses 2 Linux VMs and 1 IOS XE router to stand in for
# NEL's ~20 servers, 3 routers and 14 switches (see docs/DECISIONS.md).

all:
  children:
    linux_servers:
      hosts:
        srv-main-01:
        srv-acq-01:

    ios_devices:
      children:
        routers:
          hosts:
            rtr-main-01:
        # NEL has 2 core + 12 access switches. No IOS switch image is available in
        # this VirtualBox lab, so the group exists (and gets its own variables) but is
        # empty in the PoC. Adding a switch = adding one hostname here.
        switches:
          hosts: {}

    site_main:
      hosts:
        srv-main-01:
        rtr-main-01:

    site_acquired:
      hosts:
        srv-acq-01:
